<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="parent-container">
        <div class="inputscreen">
            <input type="text" name="inputText" id="inputtext" placeholder="0">
        </div>
        <div class="calculate-div">
            <div class="symbols line">
                <button class="del">DEL</button>
                <button class="ac">AC</button>
                <button class="operator">%</button>
                <button class="operator">/</button>
            </div>
            <div class="firstline line">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">*</button>
            </div>
            <div class="secondline line">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">-</button>
            </div>
            <div class="thirdline line">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">+</button>
            </div>
            <div class="fourthline line">
                <button>00</button>
                <button>0</button>
                <button>.</button>
                <button class="equals">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
